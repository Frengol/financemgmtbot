steps:
  - name: "gcr.io/cloud-builders/docker"
    id: "build-image"
    args:
      - "build"
      - "--pull"
      - "-t"
      - "${_AR_HOSTNAME}/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "push-image"
    args:
      - "push"
      - "${_AR_HOSTNAME}/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}"

  - name: "gcr.io/cloud-builders/docker"
    id: "capture-image-digest"
    entrypoint: "/bin/sh"
    args:
      - "-c"
      - |
        set -eu
        docker inspect --format='{{index .RepoDigests 0}}' \
          "${_AR_HOSTNAME}/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}" \
          > /workspace/image_ref.txt

  - name: "gcr.io/cloud-builders/gcloud"
    id: "resolve-secret-versions"
    entrypoint: "python3"
    args:
      - "scripts/prune_secret_versions.py"
      - "resolve-latest"
      - "--project"
      - "${PROJECT_ID}"
      - "--secret-spec"
      - "SUPABASE_KEY=${_SECRET_ID_SUPABASE_KEY}"
      - "--secret-spec"
      - "TELEGRAM_BOT_TOKEN=${_SECRET_ID_TELEGRAM_BOT_TOKEN}"
      - "--secret-spec"
      - "TELEGRAM_SECRET_TOKEN=${_SECRET_ID_TELEGRAM_SECRET_TOKEN}"
      - "--secret-spec"
      - "DEEPSEEK_API_KEY=${_SECRET_ID_DEEPSEEK_API_KEY}"
      - "--secret-spec"
      - "GROQ_API_KEY=${_SECRET_ID_GROQ_API_KEY}"
      - "--secret-spec"
      - "GEMINI_API_KEY=${_SECRET_ID_GEMINI_API_KEY}"
      - "--secret-spec"
      - "RECURRING_EXPENSES_CRON_SECRET=${_SECRET_ID_RECURRING_EXPENSES_CRON_SECRET}"
      - "--secret-spec"
      - "DATA_ENCRYPTION_KEY=${_SECRET_ID_DATA_ENCRYPTION_KEY}"
      - "--env-output"
      - "/workspace/secret_env_vars.txt"
      - "--protected-output"
      - "/workspace/resolved_secret_versions.json"

  - name: "gcr.io/cloud-builders/gcloud"
    id: "deploy-worker-cloud-run"
    entrypoint: "/bin/sh"
    args:
      - "-c"
      - |
        set -eu
        IMAGE_REF=$$(cat /workspace/image_ref.txt)
        WORKER_SECRET_ENV_VARS=$$(python3 -c 'import sys; allowed={"SUPABASE_KEY","TELEGRAM_BOT_TOKEN","DEEPSEEK_API_KEY","GROQ_API_KEY","GEMINI_API_KEY","DATA_ENCRYPTION_KEY"}; print(",".join(item for item in open(sys.argv[1]).read().strip().split(",") if item.split("=",1)[0] in allowed))' /workspace/secret_env_vars.txt)
        gcloud run deploy "${_WORKER_SERVICE_NAME}" \
          --project "${PROJECT_ID}" \
          --image "$$IMAGE_REF" \
          --region "${_REGION}" \
          --platform managed \
          --service-account "${_WORKER_RUNTIME_SERVICE_ACCOUNT}" \
          --ingress internal \
          --no-allow-unauthenticated \
          --min-instances "0" \
          --max-instances "1" \
          --concurrency "1" \
          --timeout "240s" \
          --cpu "1" \
          --memory "512Mi" \
          --update-env-vars "APP_COMPONENT=telegram-worker,APP_COMMIT_SHA=${COMMIT_SHA},APP_RELEASE_SHA=${SHORT_SHA},SUPABASE_URL=${_SUPABASE_URL},SUPABASE_GASTOS_TABLE=gastos" \
          --set-secrets "$$WORKER_SECRET_ENV_VARS" \
          --update-labels "commit-sha=${SHORT_SHA}" \
          --quiet

  - name: "gcr.io/cloud-builders/gcloud"
    id: "deploy-api-cloud-run"
    entrypoint: "/bin/sh"
    args:
      - "-c"
      - |
        set -eu
        IMAGE_REF=$$(cat /workspace/image_ref.txt)
        API_SECRET_ENV_VARS=$$(python3 -c 'import sys; allowed={"SUPABASE_KEY","TELEGRAM_SECRET_TOKEN","RECURRING_EXPENSES_CRON_SECRET","DATA_ENCRYPTION_KEY"}; print(",".join(item for item in open(sys.argv[1]).read().strip().split(",") if item.split("=",1)[0] in allowed))' /workspace/secret_env_vars.txt)
        WORKER_URL=$$(gcloud run services describe "${_WORKER_SERVICE_NAME}" --project "${PROJECT_ID}" --region "${_REGION}" --platform managed --format='value(status.url)')
        gcloud run deploy "${_API_SERVICE_NAME}" \
          --project "${PROJECT_ID}" \
          --image "$$IMAGE_REF" \
          --region "${_REGION}" \
          --platform managed \
          --service-account "${_API_RUNTIME_SERVICE_ACCOUNT}" \
          --ingress all \
          --allow-unauthenticated \
          --min-instances "0" \
          --max-instances "1" \
          --concurrency "10" \
          --timeout "30s" \
          --cpu "1" \
          --memory "512Mi" \
          --update-env-vars "APP_COMPONENT=api,APP_COMMIT_SHA=${COMMIT_SHA},APP_RELEASE_SHA=${SHORT_SHA},SUPABASE_URL=${_SUPABASE_URL},SUPABASE_GASTOS_TABLE=gastos,FRONTEND_PUBLIC_URL=${_FRONTEND_PUBLIC_URL},FRONTEND_ALLOWED_ORIGINS=${_FRONTEND_ALLOWED_ORIGIN},AUTH_TEST_MODE=false,ALLOW_LOCAL_DEV_AUTH=false,TELEGRAM_TASKS_PROJECT=${PROJECT_ID},TELEGRAM_TASKS_LOCATION=${_REGION},TELEGRAM_TASKS_QUEUE=${_TASK_QUEUE_NAME},TELEGRAM_WORKER_URL=$$WORKER_URL,TELEGRAM_TASK_INVOKER_SERVICE_ACCOUNT=${_TASK_INVOKER_SERVICE_ACCOUNT}" \
          --set-secrets "$$API_SECRET_ENV_VARS" \
          --update-labels "commit-sha=${SHORT_SHA}" \
          --quiet

  - name: "gcr.io/cloud-builders/gcloud"
    id: "smoke-runtime-metadata"
    entrypoint: "/bin/sh"
    args:
      - "-c"
      - |
        set -eu
        SERVICE_URL=$$(gcloud run services describe "${_API_SERVICE_NAME}" \
          --project "${PROJECT_ID}" \
          --region "${_REGION}" \
          --platform managed \
          --format='value(status.url)')
        python3 - "$$SERVICE_URL/api/meta/runtime" <<'PY'
        import sys
        import urllib.request

        with urllib.request.urlopen(sys.argv[1], timeout=20) as response:
            if response.status != 200:
                raise SystemExit(f"unexpected status {response.status}")
        PY

  - name: "gcr.io/cloud-builders/gcloud"
    id: "prune-secret-versions"
    entrypoint: "/bin/sh"
    args:
      - "-c"
      - |
        set -eu
        if [ "${_PRUNE_SECRET_VERSIONS}" != "true" ]; then
          echo "secret version pruning disabled"
          exit 0
        fi

        python3 scripts/prune_secret_versions.py prune \
          --project "${PROJECT_ID}" \
          --retention 2 \
          --protected-version-file /workspace/resolved_secret_versions.json \
          --cloud-run-service "${_API_SERVICE_NAME}" \
          --cloud-run-service "${_WORKER_SERVICE_NAME}" \
          --cloud-run-region "${_REGION}" \
          --min-age-secret "${_SECRET_ID_DATA_ENCRYPTION_KEY}=7" \
          --ignore-missing-secrets \
          --execute \
          --secret "${_SECRET_ID_SUPABASE_KEY}" \
          --secret "${_SECRET_ID_TELEGRAM_BOT_TOKEN}" \
          --secret "${_SECRET_ID_TELEGRAM_SECRET_TOKEN}" \
          --secret "${_SECRET_ID_DEEPSEEK_API_KEY}" \
          --secret "${_SECRET_ID_GROQ_API_KEY}" \
          --secret "${_SECRET_ID_GEMINI_API_KEY}" \
          --secret "${_SECRET_ID_RECURRING_EXPENSES_CRON_SECRET}" \
          --secret "${_SECRET_ID_DATA_ENCRYPTION_KEY}"

images:
  - "${_AR_HOSTNAME}/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${SHORT_SHA}"

substitutions:
  _AR_HOSTNAME: "southamerica-east1-docker.pkg.dev"
  _AR_REPOSITORY: "cloud-run-source-deploy"
  _IMAGE_NAME: "financemgmtbot-git"
  _API_SERVICE_NAME: "financemgmtbot-git"
  _WORKER_SERVICE_NAME: "financemgmtbot-worker"
  _REGION: "southamerica-east1"
  _TASK_QUEUE_NAME: "telegram-updates"
  _API_RUNTIME_SERVICE_ACCOUNT: "financemgmtbot-api@financemgmtbot.iam.gserviceaccount.com"
  _WORKER_RUNTIME_SERVICE_ACCOUNT: "financemgmtbot-worker@financemgmtbot.iam.gserviceaccount.com"
  _TASK_INVOKER_SERVICE_ACCOUNT: "financemgmtbot-task-invoker@financemgmtbot.iam.gserviceaccount.com"
  _SECRET_ID_SUPABASE_KEY: "SUPABASE_KEY"
  _SECRET_ID_TELEGRAM_BOT_TOKEN: "TELEGRAM_BOT_TOKEN"
  _SECRET_ID_TELEGRAM_SECRET_TOKEN: "TELEGRAM_SECRET_TOKEN"
  _SECRET_ID_DEEPSEEK_API_KEY: "DEEPSEEK_API_KEY"
  _SECRET_ID_GROQ_API_KEY: "GROQ_API_KEY"
  _SECRET_ID_GEMINI_API_KEY: "GEMINI_API_KEY"
  _SECRET_ID_RECURRING_EXPENSES_CRON_SECRET: "recurring-expenses-cron-secret"
  _SECRET_ID_DATA_ENCRYPTION_KEY: "DATA_ENCRYPTION_KEY"
  _PRUNE_SECRET_VERSIONS: "true"

options:
  logging: "CLOUD_LOGGING_ONLY"

timeout: "1200s"
